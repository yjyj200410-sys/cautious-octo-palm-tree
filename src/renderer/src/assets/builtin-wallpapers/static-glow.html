<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  canvas{display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
// ── Canvas ────────────────────────────────────────────────
var c=document.getElementById('c'),ctx=c.getContext('2d'),W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

// ── Config (updated via postMessage) ──────────────────────
var cfg={colors:['#ff6b9d','#c44dff','#4dc9f6','#f9ca24','#6c5ce7'],intensity:0.28,sensitivity:0.28};
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='nora:config'){
    if(e.data.colors)cfg.colors=e.data.colors;
    if(typeof e.data.intensity==='number')cfg.intensity=e.data.intensity;
    if(typeof e.data.sensitivity==='number')cfg.sensitivity=e.data.sensitivity;
  }
});

// Parse hex to HSL for easier manipulation
function hexToHsl(h){var r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  if(mx===mn)return{h:0,s:0,l:l};
  var d=mx-mn,s=l>0.5?d/(2-mx-mn):d/(mx+mn),h2=0;
  if(mx===r)h2=((g-b)/d)%6;else if(mx===g)h2=(b-r)/d+2;else h2=(r-g)/d+4;
  return{h:h2*60,s:s,l:l};
}

// ── Audio state ──────────────────────────────────────────
var bands={bass:0,lowMid:0,mid:0,highMid:0,treble:0};
var audioEnergy=0,beatPulse=0,lastBeat=0,smoothEnergy=0;

if(window.wallpaperRegisterAudioListener){
  window.wallpaperRegisterAudioListener(function(data){
    if(!data||!data.length)return;
    var binCount=data.length,bandSize=Math.floor(binCount/5);
    var names=['bass','lowMid','mid','highMid','treble'];
    for(var b=0;b<5;b++){
      var sum=0,start=b*bandSize,end=b===4?binCount:start+bandSize;
      for(var i=start;i<end;i++)sum+=data[i];
      bands[names[b]]=Math.min(1,sum/(end-start)*1.8);
    }
    var sens=cfg.sensitivity;
    audioEnergy=(bands.bass*0.5+bands.mid*0.35+bands.treble*0.15)*1.5*sens;
    if(bands.bass>lastBeat*1.25&&bands.bass>0.15){beatPulse=1;}
    lastBeat=lastBeat*0.8+bands.bass*0.2;
  });
}

// ── Orbs ─────────────────────────────────────────────────
var orbs=[];
var orbCount=8;
function rebuildOrbs(){
  orbs=[];orbCount=Math.round(6+cfg.intensity*6);
  for(var i=0;i<orbCount;i++){
    orbs.push({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.0015,vy:(Math.random()-0.5)*0.0015,
      r:0.1+Math.random()*0.4,hueIdx:Math.floor(Math.random()*cfg.colors.length),phase:Math.random()*Math.PI*2});
  }
}
rebuildOrbs();

// Keep track of previous config for rebuild detection
var lastColorCount=cfg.colors.length,lastIntensity=cfg.intensity;

// ── Render ───────────────────────────────────────────────
var t=0;
function render(){
  requestAnimationFrame(render);
  t+=0.016*cfg.intensity;
  beatPulse*=0.88;
  smoothEnergy+=(audioEnergy-smoothEnergy)*0.06;

  // Rebuild orbs if config changed
  if(lastColorCount!==cfg.colors.length||lastIntensity!==cfg.intensity){
    lastColorCount=cfg.colors.length;lastIntensity=cfg.intensity;
    rebuildOrbs();
  }

  var intMul=cfg.intensity;
  var sensMul=cfg.sensitivity;

  // ── Background ─────────────────────────────────────────
  var bgGrad=ctx.createRadialGradient(W*0.5,H*0.35,0,W*0.5,H*0.5,W*0.9);
  var bgColor=hexToHsl(cfg.colors[0]);
  var bgHue=bgColor.h+bands.mid*40*sensMul+bands.highMid*30*sensMul;
  var bgSat=50+bands.treble*50*sensMul;
  var bgLight=3+audioEnergy*8*sensMul+beatPulse*10*intMul;
  ctx.fillStyle=bgGrad;
  bgGrad.addColorStop(0,'hsl('+bgHue+','+bgSat+'%,'+(bgLight+6)+'%)');
  bgGrad.addColorStop(0.5,'hsl('+(bgHue+20)+','+(bgSat-10)+'%,'+(bgLight+2)+'%)');
  bgGrad.addColorStop(1,'hsl('+(bgHue+40)+',40%,'+(bgLight-2)+'%)');
  ctx.fillRect(0,0,W,H);

  // ── Orbs ───────────────────────────────────────────────
  var energyBoost=(1+audioEnergy*0.8*sensMul)*intMul;
  for(var i=0;i<orbs.length;i++){
    var o=orbs[i];
    o.x+=o.vx*energyBoost;o.y+=o.vy*energyBoost;
    if(o.x<-0.2)o.x=1.2;if(o.x>1.2)o.x=-0.2;
    if(o.y<-0.2)o.y=1.2;if(o.y>1.2)o.y=-0.2;

    var ci=o.hueIdx%cfg.colors.length;
    var orbColor=hexToHsl(cfg.colors[ci]);
    var ox=o.x*W,oy=o.y*H;
    var orbR=o.r*W*(0.7+bands.bass*0.45*sensMul+beatPulse*0.25*intMul);
    var orbHue=(orbColor.h+bands.treble*80*sensMul+t*15*intMul)%360;
    var orbAlpha=0.15+bands.mid*0.25*sensMul+beatPulse*0.2*intMul;

    // Outer glow
    var g1=ctx.createRadialGradient(ox,oy,0,ox,oy,orbR*3*intMul);
    g1.addColorStop(0,'hsla('+orbHue+',100%,70%,'+(orbAlpha*1.6)+')');
    g1.addColorStop(0.3,'hsla('+orbHue+',90%,55%,'+(orbAlpha*0.9)+')');
    g1.addColorStop(0.6,'hsla('+(orbHue+30)+',80%,30%,'+(orbAlpha*0.3)+')');
    g1.addColorStop(1,'transparent');
    ctx.fillStyle=g1;ctx.fillRect(ox-orbR*3,oy-orbR*3,orbR*6,orbR*6);

    // Core
    var g2=ctx.createRadialGradient(ox,oy,0,ox,oy,orbR);
    g2.addColorStop(0,'rgba(255,255,255,'+(0.4+beatPulse*0.4*intMul)+')');
    g2.addColorStop(0.3,'hsla('+orbHue+',80%,80%,0.5)');
    g2.addColorStop(1,'transparent');
    ctx.fillStyle=g2;ctx.fillRect(ox-orbR,oy-orbR,orbR*2,orbR*2);
  }

  // ── Central aurora sweep ───────────────────────────────
  var sweepColor=hexToHsl(cfg.colors[Math.min(1,cfg.colors.length-1)]||cfg.colors[0]);
  var cx=W*0.5,cy=H*(0.35-bands.bass*0.15*sensMul);
  var sweepR=W*(0.5+bands.bass*0.3*sensMul+beatPulse*0.2*intMul);
  var sweepGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,sweepR*1.8);
  var sweepHue=sweepColor.h+bands.mid*50*sensMul+bands.highMid*40*sensMul;
  sweepGrad.addColorStop(0,'hsla('+sweepHue+',100%,75%,'+(0.25+audioEnergy*0.35*sensMul)*intMul+')');
  sweepGrad.addColorStop(0.25,'hsla('+(sweepHue+15)+',90%,60%,'+(0.18+audioEnergy*0.22*sensMul)*intMul+')');
  sweepGrad.addColorStop(0.5,'hsla('+(sweepHue+30)+',70%,35%,'+(0.08+bands.mid*0.12*sensMul)+')');
  sweepGrad.addColorStop(1,'transparent');
  ctx.fillStyle=sweepGrad;ctx.fillRect(cx-sweepR*1.8,cy-sweepR*1.8,sweepR*3.6,sweepR*3.6);

  // ── Horizontal streaks ─────────────────────────────────
  var streakCount=Math.round(2+intMul*2);
  for(var s=0;s<streakCount;s++){
    var sy=H*(0.25+s*0.22/(streakCount*0.5)+Math.sin(t*0.3+s*1.7)*0.08);
    var streakH=H*(0.04+bands.bass*0.06*sensMul+bands.lowMid*0.03*sensMul);
    var streakAlpha=(0.12+audioEnergy*0.2*sensMul+bands.lowMid*0.18*sensMul)*intMul;
    var streakGrad=ctx.createLinearGradient(0,sy-streakH,0,sy+streakH);
    var streakHue=(sweepColor.h+s*30+bands.treble*60*sensMul)%360;
    streakGrad.addColorStop(0,'transparent');
    streakGrad.addColorStop(0.4,'hsla('+streakHue+',100%,70%,'+streakAlpha+')');
    streakGrad.addColorStop(0.6,'hsla('+streakHue+',100%,70%,'+streakAlpha+')');
    streakGrad.addColorStop(1,'transparent');
    ctx.fillStyle=streakGrad;ctx.fillRect(0,sy-streakH,W,streakH*2);
  }

  // ── Beat flash ─────────────────────────────────────────
  if(beatPulse>0.3){
    ctx.fillStyle='rgba(255,255,255,'+(beatPulse*0.08*intMul)+')';
    ctx.fillRect(0,0,W,H);
  }
}
render();
</script></body></html>
