<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060811}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c" aria-hidden="true"></canvas><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const defaults=['#ff6b9d','#c44dff','#4dc9f6','#f9ca24','#6c5ce7'];
const cfg={colors:defaults.slice(),intensity:0.28,sensitivity:0.28};
let W=1,H=1,time=0,lastTime=0,energy=0,targetEnergy=0;
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const clamp=v=>Math.max(0,Math.min(1,v));
window.addEventListener('message',event=>{
  const d=event.data;if(!d||d.type!=='nora:config')return;
  if(Array.isArray(d.colors)){const colors=d.colors.filter(c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c));if(colors.length)cfg.colors=colors.slice(0,5);}
  if(Number.isFinite(d.intensity))cfg.intensity=clamp(d.intensity);
  if(Number.isFinite(d.sensitivity))cfg.sensitivity=clamp(d.sensitivity);
  rebuild();
});
function readAudio(data){
  if(!data||!data.length)return;
  let sum=0;const count=Math.max(1,Math.floor(data.length*0.4));
  for(let i=0;i<count;i++)sum+=Number(data[i])||0;
  targetEnergy=clamp(sum/count*1.8);
}
if(window.wallpaperRegisterAudioListener)window.wallpaperRegisterAudioListener(readAudio);
else window.addEventListener('message',event=>{if(event.data?.type==='nora:audioLevels')readAudio(event.data.spectrum);});
function resize(){
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);
  const scale=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0);rebuild();
}
window.addEventListener('resize',resize);
function tick(now){
  requestAnimationFrame(tick);
  if(document.hidden){lastTime=now;return;}
  if(now-lastTime<1000/30)return;
  const dt=Math.min(0.08,(now-(lastTime||now))/1000);lastTime=now;
  if(!motion.matches)time+=dt*cfg.intensity;
  energy+=( (motion.matches?0:targetEnergy*cfg.sensitivity)-energy)*(1-Math.exp(-dt*3));
  draw();
}
// A stable star atlas: no respawning, zooming or streaks across the interface.
let seed=81723;
function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const stars=Array.from({length:480},(_,i)=>{
  const x=random(),galaxy=i>250;
  const y=galaxy?0.83-x*0.64+(random()+random()+random()-1.5)*0.12:random();
  return{x,y,size:0.4+random()*1.2,phase:random()*Math.PI*2,rate:0.3+random()*0.7,color:i%5,bright:0.3+random()*0.6};
});
let sky,sprites=[];
function rebuild(){
  sky=document.createElement('canvas');sky.width=640;sky.height=360;
  const g=sky.getContext('2d');g.fillStyle='#060811';g.fillRect(0,0,640,360);
  for(let i=0;i<5;i++){
    const x=640*(0.12+i*0.2),y=360*(0.8-i*0.13),r=140;
    const mist=g.createRadialGradient(x,y,0,x,y,r);
    const color=cfg.colors[i%cfg.colors.length];
    mist.addColorStop(0,color+'18');mist.addColorStop(0.4,color+'0b');mist.addColorStop(1,color+'00');
    g.fillStyle=mist;g.fillRect(x-r,y-r,r*2,r*2);
  }
  sprites=cfg.colors.map(color=>{
    const sprite=document.createElement('canvas');sprite.width=sprite.height=32;
    const s=sprite.getContext('2d'),glow=s.createRadialGradient(16,16,0,16,16,16);
    glow.addColorStop(0,color+'ff');glow.addColorStop(0.08,color+'dc');glow.addColorStop(0.2,color+'45');glow.addColorStop(1,color+'00');
    s.fillStyle=glow;s.fillRect(0,0,32,32);return sprite;
  });
}
function draw(){
  ctx.drawImage(sky,0,0,W,H);ctx.globalCompositeOperation='screen';
  for(let i=0;i<stars.length;i++){
    const star=stars[i];
    const twinkle=0.8+Math.sin(time*star.rate+star.phase)*0.2*cfg.intensity;
    ctx.globalAlpha=Math.min(0.9,star.bright*twinkle*(0.7+energy*0.5));
    const drift=motion.matches?0:Math.sin(time*0.08+star.phase)*3;
    const x=star.x*W+drift,y=star.y*H+drift*0.5,size=star.size*5;
    ctx.drawImage(sprites[star.color%sprites.length],x-size/2,y-size/2,size,size);
    if(i<9){
      ctx.strokeStyle=cfg.colors[star.color%cfg.colors.length];ctx.globalAlpha*=0.18;ctx.lineWidth=0.6;
      ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
resize();requestAnimationFrame(tick);

</script></body></html>
