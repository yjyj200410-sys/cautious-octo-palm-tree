  <script><![CDATA[(() => {
  const svg = document.currentScript.ownerSVGElement;
  const paths = [...svg.querySelectorAll('.ink')];
  const strokes = paths.map(path => ({path, length:path.getTotalLength()}));
  const total = strokes.reduce((n,s) => n+s.length, 0);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let progress=0, liked=false, frame=0, active=false;
  // Solve cubic-bezier(.22, 1, .36, 1), shared with the player's soft transitions.
  function ease(t) {
    let lo=0, hi=1, u=t;
    for (let i=0;i<15;i++) {
      const x=3*(1-u)*(1-u)*u*.22+3*(1-u)*u*u*.36+u*u*u;
      if(x<t)lo=u;else hi=u;u=(lo+hi)/2;
    }
    return 1-Math.pow(1-u,3);
  }
  function paint(value) {
    progress=Math.max(0,Math.min(1,value));
    let remaining=progress*total;
    for (const stroke of strokes) {
      const drawn=Math.max(0,Math.min(1,remaining/stroke.length));
      stroke.path.style.strokeDashoffset=String(1-drawn);
      remaining-=stroke.length;
    }
    svg.dataset.progress=progress.toFixed(4);
  }
  function announce() {
    svg.dispatchEvent(new CustomEvent('heartchange', {bubbles:true,
      detail:{liked,progress,animating:active}}));
  }
  function setLiked(value, options={}) {
    cancelAnimationFrame(frame);
    liked=Boolean(value);
    const target=liked?1:0, start=progress;
    svg.setAttribute('aria-pressed',String(liked));
    svg.setAttribute('aria-label',liked?'取消喜欢':'喜欢歌曲');
    svg.dataset.liked=String(liked);
    const duration=650*Math.abs(target-start);
    if(options.animate===false || reduce.matches || duration<1){
      active=false;paint(target);announce();return;
    }
    active=true;announce();
    let startTime;
    function tick(now){
      if(startTime===undefined)startTime=now;
      const t=Math.min(1,(now-startTime)/duration);
      // Both directions use the same duration and easing.
      const f=ease(t);
      paint(start+(target-start)*f);
      if(t<1)frame=requestAnimationFrame(tick);
      else{active=false;paint(target);announce();}
    }
    frame=requestAnimationFrame(tick);
  }
  svg.addEventListener('click',()=>setLiked(!liked));
  svg.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();setLiked(!liked);}
  });
  svg.addEventListener('pointerdown',()=>svg.classList.add('pressed'));
  for(const name of ['pointerup','pointerleave','pointercancel','blur'])
    svg.addEventListener(name,()=>svg.classList.remove('pressed'));
  svg.heartButton={setLiked, getState:()=>({liked,progress,animating:active}), replay(){paint(0);setLiked(true);}};
  paint(0);
})();]]></script>
</svg>
