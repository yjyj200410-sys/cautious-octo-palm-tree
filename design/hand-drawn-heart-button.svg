    .ink {stroke-dasharray:1 1;stroke-dashoffset:1;}
    #focus-ring {opacity:0;} svg:focus-visible #focus-ring {opacity:1;}
    @media(prefers-reduced-motion:reduce){#drawing{transition:none;}}
