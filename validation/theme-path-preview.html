<!doctype html><meta charset="utf-8"><title>太阳与月亮路径动画预览</title><style>body{margin:0;background:#18181b;color:#fafafa;display:grid;place-content:center;min-height:100vh;font:16px system-ui;text-align:center}button{margin:auto;width:96px;height:96px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff12;color:inherit;cursor:pointer}svg{width:56px;height:56px}p{color:#aaa}</style><button aria-label="切换太阳月亮"><svg viewBox="-18 -18 36 36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><g id="icon"><path id="shape"/><g id="rays"></g></g></svg></button><p>点击预览太阳 ↔ 月亮</p><script>let t=0,target=0,run=false;const shape=document.querySelector('#shape'),rays=document.querySelector('#rays'),icon=document.querySelector('#icon');for(let i=0;i<8;i++){let a=i*Math.PI/4;rays.innerHTML+=`<path d="M ${Math.cos(a)*10} ${Math.sin(a)*10} L ${Math.cos(a)*13} ${Math.sin(a)*13}"/>`}function draw(){let k=4.42,x=8-12*t;shape.setAttribute('d',`M0 -8 C-${k} -8 -8 -${k} -8 0 C-8 ${k} -${k} 8 0 8 C${k*(1-t)} 8 ${x} ${k} ${x} 0 C${x} -${k} ${k*(1-t)} -8 0 -8 Z`);rays.style.opacity=1-t;icon.setAttribute('transform',`rotate(${-25*t})`)}document.querySelector('button').onclick=()=>{if(run)return;run=true;target=1-target;let from=t,start=performance.now();function frame(now){let p=Math.min(1,(now-start)/460),v=p*p*(3-2*p);t=from+(target-from)*v;draw();if(p<1)requestAnimationFrame(frame);else run=false}requestAnimationFrame(frame)};draw()</script>
